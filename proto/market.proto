syntax = "proto3";

package market;

// Trading system events.
message MarketEvent {
  int64 sequence = 1;
  int64 timestamp_micros = 2;

  oneof event {
    QuoteUpdate quote = 10;
    TradeUpdate trade = 11;
    OrderBookUpdate order_book = 12;
    CandleUpdate candle = 13;
    IndexUpdate index = 14;
    InstrumentStatusUpdate instrument_status = 15;
  }
}

message QuoteUpdate {
  int32 instrument_id = 1;
  int64 bid_price_cents = 2;
  int64 ask_price_cents = 3;
  int32 bid_quantity = 4;
  int32 ask_quantity = 5;
}

message TradeUpdate {
  int32 instrument_id = 1;
  int64 price_cents = 2;
  int32 quantity = 3;
  TradeSide side = 4;
}

enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  BUY = 1;
  SELL = 2;
}

message OrderBookUpdate {
  int32 instrument_id = 1;
  BookSide side = 2;
  int32 level = 3;
  int64 price_cents = 4;
  int32 quantity = 5;
}

enum BookSide {
  BOOK_SIDE_UNSPECIFIED = 0;
  BID = 1;
  ASK = 2;
}

message CandleUpdate {
  int32 instrument_id = 1;
  int64 open_cents = 2;
  int64 high_cents = 3;
  int64 low_cents = 4;
  int64 close_cents = 5;
  int64 volume = 6;
  int64 interval_start_micros = 7;
}

message IndexUpdate {
  int32 index_id = 1;
  int64 value_cents = 2;
  int64 change_cents = 3;
}

message InstrumentStatusUpdate {
  int32 instrument_id = 1;
  InstrumentStatus status = 2;
}

enum InstrumentStatus {
  INSTRUMENT_STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  HALTED = 2;
  CLOSED = 3;
}

message TradingBatch {
  repeated MarketEvent events = 1;
}
